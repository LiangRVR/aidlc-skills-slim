name: Engine tests

on:
  push:
    paths:
      - '.agents/skills/aidlc-workflows/engine/**'
      - '.agents/skills/aidlc-workflows/SKILL.md'
      - '.agents/skills/aidlc-workflows/references/engine-*.md'
      - '.agents/skills/aidlc-workflows/references/state.md'
      - '.agents/skills/aidlc-workflows/references/transition-contract.md'
      - '.agents/skills/aidlc-workflows/references/completion-predicates.md'
      - '.agents/skills/aidlc-workflows/schemas/aidlc-state.schema.json'
  pull_request:
    paths:
      - '.agents/skills/aidlc-workflows/engine/**'
      - '.agents/skills/aidlc-workflows/SKILL.md'
      - '.agents/skills/aidlc-workflows/references/engine-*.md'
      - '.agents/skills/aidlc-workflows/references/state.md'
      - '.agents/skills/aidlc-workflows/references/transition-contract.md'
      - '.agents/skills/aidlc-workflows/references/completion-predicates.md'
      - '.agents/skills/aidlc-workflows/schemas/aidlc-state.schema.json'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .agents/skills/aidlc-workflows/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Regenerate zero-setup runtime
        if: runner.os == 'Linux'
        run: npm run sync-runtime
      - name: Upload generated runtime for reproducibility/debugging
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: generated-runtime
          path: .agents/skills/aidlc-workflows/engine/runtime
          if-no-files-found: error
      - name: Verify committed zero-setup runtime
        if: runner.os == 'Linux'
        run: git diff --exit-code -- runtime
      - name: Smoke test prebuilt CLI
        run: node bin/aidlc-engine.mjs help
