name: Engine tests

on:
  push:
    paths:
      - '.agents/skills/aidlc-workflows/engine/**'
      - '.agents/skills/aidlc-workflows/SKILL.md'
      - '.agents/skills/aidlc-workflows/references/engine-*.md'
      - '.agents/skills/aidlc-workflows/references/state.md'
      - '.agents/skills/aidlc-workflows/references/transition-contract.md'
      - '.agents/skills/aidlc-workflows/references/completion-predicates.md'
      - '.agents/skills/aidlc-workflows/references/verification.md'
      - '.agents/skills/aidlc-workflows/schemas/**'
      - '.agents/skills/aidlc-workflows/templates/project/checks.json'
  pull_request:
    paths:
      - '.agents/skills/aidlc-workflows/engine/**'
      - '.agents/skills/aidlc-workflows/SKILL.md'
      - '.agents/skills/aidlc-workflows/references/engine-*.md'
      - '.agents/skills/aidlc-workflows/references/state.md'
      - '.agents/skills/aidlc-workflows/references/transition-contract.md'
      - '.agents/skills/aidlc-workflows/references/completion-predicates.md'
      - '.agents/skills/aidlc-workflows/references/verification.md'
      - '.agents/skills/aidlc-workflows/schemas/**'
      - '.agents/skills/aidlc-workflows/templates/project/checks.json'

# Temporary one-shot write access. It is restricted below to the exact same-repo
# v0.2 head branch and will be restored to read-only after runtime publication.
permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .agents/skills/aidlc-workflows/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Test TypeScript implementation
        run: npm test
      - name: Publish compiler-generated v0.2 runtime
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/evidence-freshness-v0.2'
        shell: bash
        run: |
          git fetch origin feature/evidence-freshness-v0.2 --depth=1
          git checkout -B runtime-sync FETCH_HEAD
          npm run sync-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime
          if git diff --cached --quiet; then
            echo "Runtime already synchronized."
            exit 0
          fi
          git commit -m "build(engine): sync zero-setup runtime for v0.2"
          git push origin HEAD:feature/evidence-freshness-v0.2
      - name: Upload compiler-generated runtime
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: generated-runtime-v0.2
          path: .agents/skills/aidlc-workflows/engine/dist/src
          if-no-files-found: error
      - name: Test committed zero-setup runtime with same suite
        run: npm run test-runtime
      - name: Smoke test prebuilt CLI
        run: node bin/aidlc-engine.mjs help
