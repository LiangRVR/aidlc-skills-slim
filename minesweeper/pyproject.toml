[project]
name = "minesweeper"
version = "0.1.0"
description = "Classic Minesweeper game built with PyQt6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
